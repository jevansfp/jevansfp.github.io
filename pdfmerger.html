<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Merger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #181818;
      --border:   #2a2a2a;
      --accent:   #d4f060;
      --accent2:  #60f0c0;
      --text:     #efefef;
      --muted:    #777;
      --danger:   #f06060;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    header h1 span { color: var(--accent); }
    header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      overflow: hidden;
    }

    /* ── Drop Zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      margin: 24px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(212,240,96,0.04);
    }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
      display: block;
    }
    .drop-label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .drop-label strong {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── File List ── */
    #file-list {
      list-style: none;
      padding: 0 24px 8px;
    }
    #file-list:empty { display: none; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      animation: slideIn 0.2s ease;
      cursor: grab;
      user-select: none;
    }
    .file-item:active { cursor: grabbing; }
    .file-item.dragging { opacity: 0.4; }
    .file-item.drag-target { border-color: var(--accent2); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .file-handle { color: var(--muted); font-size: 0.9rem; cursor: grab; }
    .file-icon { font-size: 1.1rem; flex-shrink: 0; }
    .file-name { flex: 1; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-pages { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .file-remove {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 2px 4px;
      border-radius: 4px; transition: color 0.15s;
      line-height: 1;
    }
    .file-remove:hover { color: var(--danger); }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 24px 20px;
    }

    /* ── Output name ── */
    .output-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px 20px;
    }
    .output-row label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    .output-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .output-row input:focus { border-color: var(--accent); }

    /* ── Merge Button ── */
    #merge-btn {
      display: block;
      width: calc(100% - 48px);
      margin: 0 24px 24px;
      padding: 14px;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    #merge-btn:hover:not(:disabled) { background: #e0f870; }
    #merge-btn:active:not(:disabled) { transform: scale(0.98); }
    #merge-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

    /* ── Status ── */
    #status {
      margin: 0 24px 20px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      display: none;
    }
    #status.info  { background: rgba(96,240,192,0.1); border: 1px solid rgba(96,240,192,0.3); color: var(--accent2); }
    #status.error { background: rgba(240,96,96,0.1);  border: 1px solid rgba(240,96,96,0.3);  color: var(--danger); }
    #status.ok    { background: rgba(212,240,96,0.1); border: 1px solid rgba(212,240,96,0.3); color: var(--accent); }

    /* ── Hint ── */
    .hint {
      margin-top: 24px;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>PDF <span>Merger</span></h1>
  <p>Combine multiple PDFs into one — entirely in your browser</p>
</header>

<div class="card">

  <!-- Drop Zone -->
  <div id="drop-zone">
    <input type="file" id="file-input" accept=".pdf" multiple />
    <span class="drop-icon">📄</span>
    <p class="drop-label"><strong>Click to choose</strong> or drag &amp; drop PDFs here</p>
  </div>

  <!-- File List -->
  <ul id="file-list"></ul>

  <hr class="divider" id="lower-divider" style="display:none"/>

  <!-- Output filename -->
  <div class="output-row" id="output-row" style="display:none">
    <label for="output-name">Output file</label>
    <input type="text" id="output-name" value="merged.pdf" spellcheck="false"/>
  </div>

  <!-- Status -->
  <div id="status"></div>

  <!-- Merge Button -->
  <button id="merge-btn" disabled>Merge PDFs</button>

</div>

<p class="hint">Files never leave your device &nbsp;·&nbsp; No uploads &nbsp;·&nbsp; No server</p>

<script>
  const { PDFDocument } = PDFLib;

  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const fileList    = document.getElementById('file-list');
  const mergeBtn    = document.getElementById('merge-btn');
  const statusEl    = document.getElementById('status');
  const outputName  = document.getElementById('output-name');
  const outputRow   = document.getElementById('output-row');
  const lowerDiv    = document.getElementById('lower-divider');

  let files = []; // [{file, name, pages}]

  // ── Drag & Drop on zone ──────────────────────────────────────
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => {
    addFiles([...fileInput.files]);
    fileInput.value = '';
  });

  // ── Add files ────────────────────────────────────────────────
  async function addFiles(newFiles) {
    for (const f of newFiles) {
      if (!f.name.toLowerCase().endsWith('.pdf')) continue;
      const pages = await getPageCount(f);
      files.push({ file: f, name: f.name, pages });
    }
    renderList();
  }

  async function getPageCount(file) {
    try {
      const buf  = await file.arrayBuffer();
      const doc  = await PDFDocument.load(buf, { ignoreEncryption: true });
      return doc.getPageCount();
    } catch { return '?'; }
  }

  // ── Render list ──────────────────────────────────────────────
  function renderList() {
    fileList.innerHTML = '';
    files.forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'file-item';
      li.draggable = true;
      li.dataset.index = i;
      li.innerHTML = `
        <span class="file-handle" title="Drag to reorder">⠿</span>
        <span class="file-icon">📄</span>
        <span class="file-name" title="${item.name}">${item.name}</span>
        <span class="file-pages">${item.pages} pg</span>
        <button class="file-remove" title="Remove" data-i="${i}">✕</button>
      `;
      fileList.appendChild(li);
    });

    // Remove buttons
    fileList.querySelectorAll('.file-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        files.splice(+btn.dataset.i, 1);
        renderList();
      });
    });

    // Drag-to-reorder
    initDragSort();

    const hasFiles = files.length > 1;
    mergeBtn.disabled = files.length < 2;
    lowerDiv.style.display  = files.length ? 'block' : 'none';
    outputRow.style.display = files.length ? 'flex'  : 'none';
    hideStatus();
  }

  // ── Drag-to-reorder list items ───────────────────────────────
  let dragSrc = null;
  function initDragSort() {
    fileList.querySelectorAll('.file-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragSrc = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        fileList.querySelectorAll('.file-item').forEach(i => i.classList.remove('drag-target'));
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        if (item !== dragSrc) item.classList.add('drag-target');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-target'));
      item.addEventListener('drop', e => {
        e.preventDefault();
        item.classList.remove('drag-target');
        if (!dragSrc || dragSrc === item) return;
        const from = +dragSrc.dataset.index;
        const to   = +item.dataset.index;
        const [moved] = files.splice(from, 1);
        files.splice(to, 0, moved);
        renderList();
      });
    });
  }

  // ── Merge ────────────────────────────────────────────────────
  mergeBtn.addEventListener('click', async () => {
    mergeBtn.disabled = true;
    showStatus('info', '⏳  Merging PDFs…');

    try {
      const merged = await PDFDocument.create();

      for (const item of files) {
        const buf   = await item.file.arrayBuffer();
        const donor = await PDFDocument.load(buf);
        const indices = donor.getPageIndices();
        const copied = await merged.copyPages(donor, indices);
        copied.forEach(p => merged.addPage(p));
      }

      const bytes    = await merged.save();
      const blob     = new Blob([bytes], { type: 'application/pdf' });
      const url      = URL.createObjectURL(blob);
      const a        = document.createElement('a');
      a.href         = url;
      a.download     = outputName.value.trim() || 'merged.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      const total = files.reduce((s, f) => s + (Number(f.pages) || 0), 0);
      showStatus('ok', `✓  Done! ${files.length} files · ${total} pages → ${a.download}`);
    } catch (err) {
      showStatus('error', `✗  Error: ${err.message}`);
    }

    mergeBtn.disabled = false;
  });

  // ── Status helpers ───────────────────────────────────────────
  function showStatus(type, msg) {
    statusEl.textContent  = msg;
    statusEl.className    = type;
    statusEl.style.display = 'block';
  }
  function hideStatus() {
    statusEl.style.display = 'none';
  }
</script>
</body>
</html>
